kind = "web"
previewPath = "/"
title = "Gym Growth Page V1"
description = "A premium, mobile-first local gym website template designed to convert visitors into free-trial bookings, WhatsApp conversations, and calls. Gym details, verified claims, images, and contact links are centralized for reuse across gyms in India."
version = "1.0.0"
id = "artifacts/gym-growth-page-v1"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20780

[services.development]
run = "pnpm --filter @workspace/gym-growth-page-v1 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gym-growth-page-v1", "run", "build" ]
serve = "static"
publicDir = "artifacts/gym-growth-page-v1/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20780"
BASE_PATH = "/"
